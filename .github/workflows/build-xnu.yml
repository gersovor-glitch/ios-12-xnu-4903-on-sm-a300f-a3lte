name: Build XNU for a3lte

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-xnu:
    name: Build XNU (ARM64 a3lte)
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: |
          # Install llvm for loader build
          brew install llvm@18
          echo "/usr/local/opt/llvm@18/bin" >> $GITHUB_PATH

      - name: Build a3lte loader
        working-directory: ./a3lte-loader
        run: |
          export PATH="/usr/local/opt/llvm@18/bin:$PATH"
          chmod +x build.sh
          ./build.sh

      - name: Build XNU kernel for a3lte (DEVELOPMENT)
        working-directory: ./xnu
        env:
          MACHINE_CONFIGS: a3lte
        run: |
          # Use the macOS SDK
          SDKROOT=$(xcrun --show-sdk-path)
          echo "Using SDKROOT: $SDKROOT"

          # Build XNU with a3lte machine config
          make SDKROOT="$SDKROOT" ARCH_CONFIGS=ARM64 MACHINE_CONFIGS=a3lte KERNEL_CONFIGS=DEVELOPMENT

      - name: Find and copy built kernel
        working-directory: ./xnu
        run: |
          # Find the built kernel
          KERNEL_PATH=$(find BUILD -name "kernel.development*" -type f | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          if [ -z "$KERNEL_PATH" ]; then
            echo "ERROR: Could not find built kernel"
            find BUILD -name "kernel*" -type f
            exit 1
          fi
          echo "Found kernel at: $KERNEL_PATH"
          cp "$KERNEL_PATH" ../mach_kernel
          ls -la ../mach_kernel

      - name: Copy loader-Image
        run: |
          if [ -f a3lte-loader/out/loader-Image ]; then
            cp a3lte-loader/out/loader-Image ./loader-Image
            ls -la ./loader-Image
          else
            echo "ERROR: loader-Image not found"
            find a3lte-loader -name "loader-Image" -type f
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a3lte-xnu-build
          path: |
            mach_kernel
            loader-Image
          retention-days: 30

  build-xnu-release:
    name: Build XNU (ARM64 a3lte RELEASE)
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: |
          brew install llvm@18
          echo "/usr/local/opt/llvm@18/bin" >> $GITHUB_PATH

      - name: Build a3lte loader
        working-directory: ./a3lte-loader
        run: |
          export PATH="/usr/local/opt/llvm@18/bin:$PATH"
          chmod +x build.sh
          ./build.sh

      - name: Build XNU kernel for a3lte (RELEASE)
        working-directory: ./xnu
        env:
          MACHINE_CONFIGS: a3lte
        run: |
          SDKROOT=$(xcrun --show-sdk-path)
          echo "Using SDKROOT: $SDKROOT"
          make SDKROOT="$SDKROOT" ARCH_CONFIGS=ARM64 MACHINE_CONFIGS=a3lte KERNEL_CONFIGS=RELEASE

      - name: Find and copy built kernel
        working-directory: ./xnu
        run: |
          KERNEL_PATH=$(find BUILD -name "kernel.release*" -type f | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          if [ -z "$KERNEL_PATH" ]; then
            echo "ERROR: Could not find built kernel"
            find BUILD -name "kernel*" -type f
            exit 1
          fi
          echo "Found kernel at: $KERNEL_PATH"
          cp "$KERNEL_PATH" ../mach_kernel.release
          ls -la ../mach_kernel.release

      - name: Copy loader-Image
        run: |
          if [ -f a3lte-loader/out/loader-Image ]; then
            cp a3lte-loader/out/loader-Image ./loader-Image.release
            ls -la ./loader-Image.release
          else
            echo "ERROR: loader-Image not found"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a3lte-xnu-build-release
          path: |
            mach_kernel.release
            loader-Image.release
          retention-days: 30