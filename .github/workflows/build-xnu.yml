name: Build XNU for a3lte

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-xnu:
    name: Build XNU (ARM64 a3lte)
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify xnu submodule
        run: |
          ls -la xnu/
          ls -la xnu/config/
          ls -la xnu/pexpert/arm64/

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: |
          # Install llvm for potential future use
          brew install llvm@18
          echo "/usr/local/opt/llvm@18/bin" >> $GITHUB_PATH

      - name: Build XNU kernel for a3lte (DEVELOPMENT)
        working-directory: ./xnu
        env:
          MACHINE_CONFIGS: a3lte
        run: |
          # Use the macOS SDK
          SDKROOT=$(xcrun --show-sdk-path)
          echo "Using SDKROOT: $SDKROOT"

          # Debug: check build environment
          echo "=== Build Environment ==="
          pwd
          ls -la config/
          ls -la pexpert/arm64/
          echo "MAKETOP: $MAKETOP"
          echo "SRCROOT: $SRCROOT"

          # Build XNU with a3lte machine config
          make SDKROOT="$SDKROOT" ARCH_CONFIGS=ARM64 MACHINE_CONFIGS=a3lte KERNEL_CONFIGS=DEVELOPMENT 2>&1 | tail -100

      - name: Find and copy built kernel
        working-directory: ./xnu
        run: |
          # Find the built kernel
          echo "=== Searching for kernel (from xnu dir) ==="
          pwd
          echo "=== All kernel files ==="
          find . -name "kernel*" -type f 2>/dev/null | head -50
          echo "=== BUILD directory structure ==="
          ls -la BUILD/ 2>/dev/null || echo "No BUILD dir"
          find BUILD -type f -name "kernel*" 2>/dev/null | head -50
          echo "=== Searching for development kernel ==="
          # Try multiple patterns
          KERNEL_PATH=$(find . -name "kernel.development*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          if [ -z "$KERNEL_PATH" ]; then
            # Try alternative pattern
            KERNEL_PATH=$(find . -name "kernel.*development*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            # Try any kernel in development config
            KERNEL_PATH=$(find . -path "*DEVELOPMENT*" -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            # Try kernel in obj/development
            KERNEL_PATH=$(find . -path "*development*" -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            # Try BUILD directory
            KERNEL_PATH=$(find BUILD -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            echo "ERROR: Could not find built kernel"
            find . -name "kernel*" -type f 2>/dev/null | head -50
            exit 1
          fi
          echo "Found kernel at: $KERNEL_PATH"
          cp "$KERNEL_PATH" /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel
          ls -la /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a3lte-xnu-build
          path: |
            /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel
          retention-days: 30

  build-xnu-release:
    name: Build XNU (ARM64 a3lte RELEASE)
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify xnu submodule
        run: |
          ls -la xnu/
          ls -la xnu/config/
          ls -la xnu/pexpert/arm64/

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: |
          brew install llvm@18
          echo "/usr/local/opt/llvm@18/bin" >> $GITHUB_PATH

      - name: Build XNU kernel for a3lte (RELEASE)
        working-directory: ./xnu
        env:
          MACHINE_CONFIGS: a3lte
        run: |
          SDKROOT=$(xcrun --show-sdk-path)
          echo "Using SDKROOT: $SDKROOT"

          # Debug: check build environment
          echo "=== Build Environment ==="
          pwd
          ls -la config/
          ls -la pexpert/arm64/
          echo "MAKETOP: $MAKETOP"
          echo "SRCROOT: $SRCROOT"

          make SDKROOT="$SDKROOT" ARCH_CONFIGS=ARM64 MACHINE_CONFIGS=a3lte KERNEL_CONFIGS=RELEASE 2>&1 | tail -100

      - name: Find and copy built kernel
        working-directory: ./xnu
        run: |
          # Find the built kernel
          echo "=== Searching for kernel (from xnu dir) ==="
          pwd
          echo "=== All kernel files ==="
          find . -name "kernel*" -type f 2>/dev/null | head -50
          echo "=== BUILD directory structure ==="
          ls -la BUILD/ 2>/dev/null || echo "No BUILD dir"
          find BUILD -type f -name "kernel*" 2>/dev/null | head -50
          echo "=== Searching for release kernel ==="
          # Try multiple patterns
          KERNEL_PATH=$(find . -name "kernel.release*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          if [ -z "$KERNEL_PATH" ]; then
            # Try alternative pattern
            KERNEL_PATH=$(find . -name "kernel.*release*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            # Try any kernel in release config
            KERNEL_PATH=$(find . -path "*RELEASE*" -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            # Try kernel in obj/release
            KERNEL_PATH=$(find . -path "*release*" -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            # Try BUILD directory
            KERNEL_PATH=$(find BUILD -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            echo "ERROR: Could not find built kernel"
            find . -name "kernel*" -type f 2>/dev/null | head -50
            exit 1
          fi
          echo "Found kernel at: $KERNEL_PATH"
          cp "$KERNEL_PATH" /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel.release
          ls -la /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel.release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a3lte-xnu-build-release
          path: |
            /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel.release
          retention-days: 30