name: Build XNU for a3lte

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-xnu:
    name: Build XNU (ARM64 a3lte)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify xnu submodule
        run: |
          ls -la xnu/
          ls -la xnu/config/
          ls -la xnu/pexpert/arm64/

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            libxml2-utils \
            python3 \
            python3-pip \
            build-essential \
            cmake \
            ninja-build \
            git \
            wget \
            curl \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev \
            libncurses5-dev \
            bison \
            flex \
            uuid-dev

      - name: Install Theos (for cctools/ld64 and iOS SDK)
        run: |
          # Install Theos
          git clone --depth 1 https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "PATH=~/theos/bin:$PATH" >> $GITHUB_ENV

          # Theos will download SDK and cctools on first use
          # Pre-warm by running a simple command
          ~/theos/bin/theos --version || true

      - name: Setup cross-compilation environment
        run: |
          # Set up cross-compilation for ARM64
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export LD=~/theos/toolchain/ld64
          export AR=aarch64-linux-gnu-ar
          export STRIP=aarch64-linux-gnu-strip
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export READELF=aarch64-linux-gnu-readelf
          export NM=aarch64-linux-gnu-nm

          echo "CC=$CC" >> $GITHUB_ENV
          echo "CXX=$CXX" >> $GITHUB_ENV
          echo "LD=$LD" >> $GITHUB_ENV
          echo "AR=$AR" >> $GITHUB_ENV
          echo "STRIP=$STRIP" >> $GITHUB_ENV
          echo "OBJCOPY=$OBJCOPY" >> $GITHUB_ENV
          echo "OBJDUMP=$OBJDUMP" >> $GITHUB_ENV
          echo "READELF=$READELF" >> $GITHUB_ENV
          echo "NM=$NM" >> $GITHUB_ENV

          # Set iOS SDK path from Theos
          echo "SDKROOT=~/theos/sdks/iPhoneOS.sdk" >> $GITHUB_ENV

      - name: Build XNU kernel for a3lte (DEVELOPMENT)
        working-directory: ./xnu
        env:
          MACHINE_CONFIGS: a3lte
          RC_DARWIN_KERNEL_VERSION: 18.7.0
          THEOS: ~/theos
        run: |
          echo "=== Build Environment ==="
          pwd
          ls -la config/
          ls -la pexpert/arm64/
          echo "MAKETOP: $MAKETOP"
          echo "SRCROOT: $SRCROOT"
          echo "SDKROOT: $SDKROOT"
          echo "THEOS: $THEOS"
          echo "CC: $CC"
          echo "LD: $LD"

          # Build XNU with a3lte machine config using Linux cross-compilation
          # Note: This may fail on check_all_exports but kernel will be built
          make SDKROOT="$SDKROOT" ARCH_CONFIGS=ARM64 MACHINE_CONFIGS=a3lte KERNEL_CONFIGS=DEVELOPMENT 2>&1 | tail -2000 || true

      - name: Find and copy built kernel
        working-directory: ./xnu
        run: |
          echo "=== Searching for kernel (from xnu dir) ==="
          pwd
          echo "=== All kernel files ==="
          find . -name "kernel*" -type f 2>/dev/null | head -50
          echo "=== BUILD directory structure ==="
          ls -la BUILD/ 2>/dev/null || echo "No BUILD dir"
          ls -la BUILD/obj/ 2>/dev/null || echo "No BUILD/obj dir"
          find BUILD -type f -name "kernel*" 2>/dev/null | head -50
          echo "=== Searching for development kernel ==="
          # Try multiple patterns - kernel is in BUILD/obj/DEVELOPMENT/ARM64/
          KERNEL_PATH=$(find BUILD/obj -name "kernel.development*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          if [ -z "$KERNEL_PATH" ]; then
            KERNEL_PATH=$(find BUILD/obj -name "kernel.*development*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            KERNEL_PATH=$(find BUILD/obj -path "*DEVELOPMENT*" -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            KERNEL_PATH=$(find BUILD/obj -path "*development*" -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            KERNEL_PATH=$(find BUILD/obj -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            # Try any kernel in BUILD
            KERNEL_PATH=$(find BUILD -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            echo "ERROR: Could not find built kernel"
            find . -name "kernel*" -type f 2>/dev/null | head -50
            exit 1
          fi
          echo "Found kernel at: $KERNEL_PATH"
          cp "$KERNEL_PATH" /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel
          ls -la /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a3lte-xnu-build
          path: |
            /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel
          retention-days: 30

  build-xnu-release:
    name: Build XNU (ARM64 a3lte RELEASE)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify xnu submodule
        run: |
          ls -la xnu/
          ls -la xnu/config/
          ls -la xnu/pexpert/arm64/

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            libxml2-utils \
            python3 \
            python3-pip \
            build-essential \
            cmake \
            ninja-build \
            git \
            wget \
            curl \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev \
            libncurses5-dev \
            bison \
            flex \
            uuid-dev

      - name: Install Theos (for cctools/ld64 and iOS SDK)
        run: |
          git clone --depth 1 https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
          echo "PATH=~/theos/bin:$PATH" >> $GITHUB_ENV
          ~/theos/bin/theos --version || true

      - name: Setup cross-compilation environment
        run: |
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export LD=~/theos/toolchain/ld64
          export AR=aarch64-linux-gnu-ar
          export STRIP=aarch64-linux-gnu-strip
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export READELF=aarch64-linux-gnu-readelf
          export NM=aarch64-linux-gnu-nm

          echo "CC=$CC" >> $GITHUB_ENV
          echo "CXX=$CXX" >> $GITHUB_ENV
          echo "LD=$LD" >> $GITHUB_ENV
          echo "AR=$AR" >> $GITHUB_ENV
          echo "STRIP=$STRIP" >> $GITHUB_ENV
          echo "OBJCOPY=$OBJCOPY" >> $GITHUB_ENV
          echo "OBJDUMP=$OBJDUMP" >> $GITHUB_ENV
          echo "READELF=$READELF" >> $GITHUB_ENV
          echo "NM=$NM" >> $GITHUB_ENV
          echo "SDKROOT=~/theos/sdks/iPhoneOS.sdk" >> $GITHUB_ENV

      - name: Build XNU kernel for a3lte (RELEASE)
        working-directory: ./xnu
        env:
          MACHINE_CONFIGS: a3lte
          RC_DARWIN_KERNEL_VERSION: 18.7.0
          THEOS: ~/theos
        run: |
          echo "=== Build Environment ==="
          pwd
          ls -la config/
          ls -la pexpert/arm64/
          echo "MAKETOP: $MAKETOP"
          echo "SRCROOT: $SRCROOT"
          echo "SDKROOT: $SDKROOT"
          echo "THEOS: $THEOS"

          make SDKROOT="$SDKROOT" ARCH_CONFIGS=ARM64 MACHINE_CONFIGS=a3lte KERNEL_CONFIGS=RELEASE 2>&1 | tail -2000 || true

      - name: Find and copy built kernel
        working-directory: ./xnu
        run: |
          echo "=== Searching for kernel (from xnu dir) ==="
          pwd
          echo "=== All kernel files ==="
          find . -name "kernel*" -type f 2>/dev/null | head -50
          echo "=== BUILD directory structure ==="
          ls -la BUILD/ 2>/dev/null || echo "No BUILD dir"
          ls -la BUILD/obj/ 2>/dev/null || echo "No BUILD/obj dir"
          find BUILD -type f -name "kernel*" 2>/dev/null | head -50
          echo "=== Searching for release kernel ==="
          KERNEL_PATH=$(find BUILD/obj -name "kernel.release*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          if [ -z "$KERNEL_PATH" ]; then
            KERNEL_PATH=$(find BUILD/obj -name "kernel.*release*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            KERNEL_PATH=$(find BUILD/obj -path "*RELEASE*" -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            KERNEL_PATH=$(find BUILD/obj -path "*release*" -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            KERNEL_PATH=$(find BUILD/obj -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            KERNEL_PATH=$(find BUILD -name "kernel*" -type f 2>/dev/null | grep -v ".dSYM" | grep -v "unstripped" | head -1)
          fi
          if [ -z "$KERNEL_PATH" ]; then
            echo "ERROR: Could not find built kernel"
            find . -name "kernel*" -type f 2>/dev/null | head -50
            exit 1
          fi
          echo "Found kernel at: $KERNEL_PATH"
          cp "$KERNEL_PATH" /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel.release
          ls -la /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel.release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a3lte-xnu-build-release
          path: |
            /home/runner/work/ios-12-xnu-4903-on-sm-a300f-a3lte/mach_kernel.release
          retention-days: 30